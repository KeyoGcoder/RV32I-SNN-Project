<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RV32I Processor Lab</title>

<!-- React + ReactDOM (CDN, no build step) -->
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<!-- Babel standalone lets us write JSX in app.js without a build step -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d2129;
    --border: #2a2f3a;
    --text: #e6e8ec;
    --muted: #9aa2b1;
    --accent: #5b9dff;
    --green: #3ecf8e;
    --red: #ff6b6b;
    --yellow: #f5c451;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #root { max-width: 1200px; margin: 0 auto; padding: 24px 20px 60px; }

  header.app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 20px; margin: 0; }
  h1 .sub { display:block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 13px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.offline { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot.checking { background: var(--yellow); animation: pulse 1.1s infinite ease-in-out; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .retry-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 12px;
    cursor: pointer;
  }
  .retry-btn:hover { border-color: var(--accent); color: var(--accent); }

  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 900px) {
    .layout { grid-template-columns: 1fr 1fr; align-items: start; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    font-size: 14px;
    margin: 0 0 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  textarea.code-editor {
    width: 100%;
    min-height: 320px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    resize: vertical;
  }

  .btn-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
  button.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.btn.primary { background: var(--accent); color: #0b1220; }
  button.btn.primary:disabled { background: #3a4252; color: #8890a0; cursor: not-allowed; }
  button.btn.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.btn.secondary:hover { border-color: var(--accent); }

  .banner {
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    border: 1px solid var(--border);
  }
  .banner.error { background: rgba(255,107,107,0.08); border-color: rgba(255,107,107,0.4); }
  .banner.error .title { color: var(--red); font-weight: 700; margin-bottom: 4px; }
  .banner .hint { color: var(--muted); margin-top: 6px; }
  .banner.offline { background: rgba(255,107,107,0.06); border-color: rgba(255,107,107,0.35); }

  .result-section { margin-top: 16px; }
  .result-section:first-child { margin-top: 0; }
  pre.output {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    overflow-x: auto;
    max-height: 260px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .status-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-badge.ok { background: rgba(62,207,142,0.15); color: var(--green); }
  .status-badge.fail { background: rgba(255,107,107,0.15); color: var(--red); }

  .a0-panel {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .a0-metric .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .a0-metric .value { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--accent); }
  .a0-metric .value.dec { color: var(--text); font-size: 14px; font-weight: 400; }

  .placeholder { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }

  footer.foot { margin-top: 30px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react" src="src/app.js"></script>
</body>
</html>
